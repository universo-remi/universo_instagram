<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 <!-- 分頁小圖 -->
<link rel="icon" href="https://i.ibb.co/ynDDVygJ/Universo-logo.png" type="image/png">
<title>Universo Mart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #FAF8F5;
    --warm-white: #FFFFFF;
    --stone: #E8E4DE;
    --taupe: #C5B9A8;
    --mink: #8C7E6E;
    --espresso: #2C2420;
    --blush: #F0E8E0;
    --gold: #B89C7A;
    --text-main: #2C2420;
    --text-muted: #8C7E6E;
    --text-light: #B5A898;
    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --radius-pill: 100px;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background-color: var(--cream);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .page {
    width: 100%;
    max-width: 480px;
    padding: 48px 24px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }
  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    margin-bottom: 40px;
    width: 100%;
  }
  .avatar-wrap { position: relative; width: 88px; height: 88px; }
  .avatar {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: linear-gradient(135deg, #F0E8E0 0%, #E8E4DE 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px; font-weight: 400; color: var(--mink);
    border: 2px solid var(--warm-white);
    overflow: hidden;
  }
  .status-dot {
    position: absolute; bottom: 4px; right: 4px;
    width: 14px; height: 14px; border-radius: 50%;
    background: #7dbb8a; border: 2.5px solid var(--cream);
  }
  .brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px; font-weight: 300;
    letter-spacing: 0.08em; color: var(--text-main);
    text-align: center; line-height: 1.1;
  }
  .tagline {
    font-size: 13px; font-weight: 300;
    color: var(--text-muted); letter-spacing: 0.04em;
    text-align: center; line-height: 1.6;
  }
  .divider { width: 32px; height: 1px; background: var(--taupe); margin: 4px auto; }
  .section-label {
    font-size: 10px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-light); align-self: flex-start;
    margin-bottom: 12px; margin-top: 32px;
    padding-left: 2px; width: 100%;
  }
  .links-stack { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .link-card {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--warm-white); border: 1px solid var(--stone);
    border-radius: var(--radius-md); padding: 14px 18px;
    text-decoration: none; color: var(--text-main);
    transition: all 0.22s ease; cursor: pointer;
    position: relative; overflow: hidden;
  }
  .link-card::before {
    content: ''; position: absolute; inset: 0;
    background: var(--blush); opacity: 0; transition: opacity 0.22s ease;
  }
  .link-card:hover::before { opacity: 1; }
  .link-card:hover { border-color: var(--taupe); transform: translateY(-1px); }
  .link-card:active { transform: translateY(0px); }
  .link-card-left {
    display: flex; align-items: center; gap: 14px;
    position: relative; z-index: 1;
  }
  .link-icon {
    width: 38px; height: 38px;
    border-radius: var(--radius-sm);
    background: var(--cream); border: 1px solid var(--stone);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0; overflow: hidden;
  }
  .link-text { display: flex; flex-direction: column; gap: 2px; }
  .link-title { font-size: 14px; font-weight: 500; color: var(--text-main); letter-spacing: 0.01em; }
  .link-sub { font-size: 12px; font-weight: 300; color: var(--text-muted); }
  .link-arrow {
    position: relative; z-index: 1; color: var(--taupe);
    font-size: 16px; flex-shrink: 0;
    transition: transform 0.22s ease, color 0.22s ease;
  }
  .link-card:hover .link-arrow { transform: translateX(3px); color: var(--mink); }
  .badge {
    position: relative; z-index: 1;
    font-size: 10px; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 9px; border-radius: var(--radius-pill);
    background: var(--espresso); color: var(--cream);
    margin-left: auto; margin-right: 10px; flex-shrink: 0;
  }
  .badge.new { background: var(--gold); color: var(--warm-white); }
  .badge.sale { background: #c97070; color: var(--warm-white); }
  .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .video-card {
    position: relative; border-radius: var(--radius-md);
    overflow: hidden; background: var(--stone);
    aspect-ratio: 9/16; cursor: pointer;
    transition: transform 0.22s ease; border: 1px solid var(--stone);
  }
  .video-card:hover { transform: scale(1.02); }
  .video-card iframe, .video-card video {
    width: 100%; height: 100%; object-fit: cover; border: none; display: block;
  }
  .video-placeholder {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; background: var(--blush);
  }
  .play-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--warm-white); border: 1px solid var(--stone);
    display: flex; align-items: center; justify-content: center;
  }
  .play-btn svg { width: 16px; height: 16px; fill: var(--mink); margin-left: 2px; }
  .video-label {
    font-size: 11px; font-weight: 400; color: var(--mink);
    text-align: center; padding: 0 12px; line-height: 1.4;
  }
  .video-card-wide {
    border-radius: var(--radius-md); overflow: hidden;
    background: var(--blush); aspect-ratio: 16/9; width: 100%;
    border: 1px solid var(--stone); position: relative;
  }
  .video-card-wide iframe { width: 100%; height: 100%; border: none; display: block; }
  .social-row {
    display: flex; gap: 10px; justify-content: center;
    width: 100%; margin-top: 32px;
  }
  .social-pill {
    display: flex; align-items: center; gap: 7px;
    background: var(--warm-white); border: 1px solid var(--stone);
    border-radius: var(--radius-pill); padding: 10px 18px;
    text-decoration: none; color: var(--text-main);
    font-size: 13px; font-weight: 400;
    transition: all 0.2s ease; cursor: pointer;
  }
  .social-pill:hover { background: var(--blush); border-color: var(--taupe); transform: translateY(-1px); }
  .social-icon { font-size: 16px; }
  .footer {
    margin-top: 48px; text-align: center;
    font-size: 11px; color: var(--text-light);
    letter-spacing: 0.04em; line-height: 1.8;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .header        { animation: fadeUp 0.6s ease both; }
  .section-label { animation: fadeUp 0.6s ease both; }
  .link-card     { animation: fadeUp 0.5s ease both; }
  .link-card:nth-child(1) { animation-delay: 0.05s; }
  .link-card:nth-child(2) { animation-delay: 0.10s; }
  .link-card:nth-child(3) { animation-delay: 0.15s; }
  .link-card:nth-child(4) { animation-delay: 0.20s; }
  .video-card, .video-card-wide { animation: fadeUp 0.6s ease 0.3s both; }
  .social-row    { animation: fadeUp 0.5s ease 0.4s both; }
  .footer        { animation: fadeUp 0.5s ease 0.5s both; }
  @media (max-width: 400px) {
    .page { padding: 36px 16px 64px; }
    .brand-name { font-size: 26px; }
  }
</style>
</head>
